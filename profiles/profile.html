<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Claire | Keep it Claire</title>
    <meta name="description" content="Keep it Claire 的社交平台承接页。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        color: #f7f2e8;
        background:
          radial-gradient(circle at 20% 18%, rgba(223, 255, 115, 0.18), transparent 20rem),
          radial-gradient(circle at 80% 28%, rgba(36, 172, 235, 0.2), transparent 24rem),
          linear-gradient(145deg, #050505, #10141a 70%);
        font-family: "Space Grotesk", "Noto Sans SC", sans-serif;
      }

      main {
        width: min(760px, 100%);
        padding: clamp(1.5rem, 5vw, 3.5rem);
        background: #0d0d0d;
        border: 1px solid rgba(255, 255, 255, 0.16);
        clip-path: polygon(1.2rem 0, 100% 0, 100% calc(100% - 1.2rem), calc(100% - 1.2rem) 100%, 0 100%, 0 1.2rem);
      }

      .label {
        display: inline-flex;
        margin-bottom: 1rem;
        padding: 0.4rem 0.7rem;
        color: #101010;
        background: #dfff73;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-family: "Archivo Black", "Noto Sans SC", sans-serif;
        font-size: clamp(3rem, 10vw, 7rem);
        line-height: 0.88;
        letter-spacing: -0.07em;
      }

      p {
        margin: 1.3rem 0 0;
        max-width: 58ch;
        color: rgba(247, 242, 232, 0.78);
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.8;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-top: 2rem;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .button {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1rem;
        color: #101010;
        background: #8ae5de;
        font-weight: 800;
        clip-path: polygon(0 0, calc(100% - 0.8rem) 0, 100% 0.8rem, 100% 100%, 0.8rem 100%, 0 calc(100% - 0.8rem));
      }

      .button.secondary {
        color: #f7f2e8;
        background: rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <main>
      <span class="label" id="profile-label">Profile</span>
      <h1 id="profile-title">Find Claire</h1>
      <p id="profile-copy">这个入口先作为本地承接页。之后拿到即刻链接或微信展示方式后，可以直接替换这里的文案和按钮。</p>
      <div class="actions">
        <a class="button" href="../about.html">Back to About</a>
        <a class="button secondary" href="mailto:xxclr27yzl@gmail.com">Email Claire</a>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const profiles = {
        jike: {
          label: "即刻",
          title: "Claire on Jike",
          copy: "这里会承接 Claire 的即刻主页。等正式链接补齐后，这个按钮可以直接跳转到即刻。",
        },
        wechat: {
          label: "微信",
          title: "WeChat",
          copy: "这里会承接微信联系方式。为了避免公开错误信息，先保留为本地展示页，之后可以替换成微信号或二维码。",
        },
      };
      const profile = profiles[id] || profiles.jike;
      document.getElementById("profile-label").textContent = profile.label;
      document.getElementById("profile-title").textContent = profile.title;
      document.getElementById("profile-copy").textContent = profile.copy;
    </script>
  </body>
</html>
